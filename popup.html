<!doctype html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="background_script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<style>
.roboto-bold{
  font-family: "Roboto", sans-serif;
  font-optical-sizing: auto;
  font-weight: 500;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
}
.roboto{
  font-family: "Roboto", sans-serif;
  font-optical-sizing: auto;
  font-weight: 350;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
}
</style>
<div class="roboto-bold" style="display: flex; flex-direction: column;">
<label
  >Light Theme:
  <select class="roboto" id="lightSelect"></select
></label>
<label
  >Dark Theme:
  <select class="roboto" style="margin-top: 3px; margin-bottom: 3px;" id="darkSelect"></select
></label>
<button id="manageButton"  style="background-color: rgba(112, 147, 196, 0.477); border:none; box-shadow: inset 0 0 0 2px #0062ff; padding: 4px; border-radius: 2px;">
  Manage themes
</button>
</div>
<script src="popup.js" type="module"></script>
